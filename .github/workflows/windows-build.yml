name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Refresh PATH
        shell: pwsh
        run: |
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsisPath) {
            Add-Content -Path $env:GITHUB_ENV -Value "PATH=$nsisPath;$env:PATH"
          }

      - name: Validate locked Cargo dependencies
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri NSIS installer
        run: npm run tauri -- build --ci --bundles nsis --target x86_64-pc-windows-msvc --no-sign

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/
          if-no-files-found: error
